<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>html,body{margin:0;background:#000;overflow:hidden}canvas{display:block}</style></head>
<body><canvas id="c" width="880" height="660"></canvas>
<script>
/* 25 channel preview signals — ?s=ch1a .. ch5e. Each drawn full-bleed, then CRT-dressed:
   rounded tube mask, scanlines, vignette, glass highlight, OSD chip. */
const q = new URLSearchParams(location.search).get("s") || "ch1a";
const c = document.getElementById("c"), x = c.getContext("2d");
const W = c.width, H = c.height, CX = W/2, CY = H/2;

const CH = {
  1: { name:"ABOUT",       t:[55,255,139]  },
  2: { name:"CONTRIBUTE",  t:[255,62,165]  },
  3: { name:"EXPERIMENTS", t:[255,179,0]   },
  4: { name:"RESEARCH",    t:[43,217,255]  },
  5: { name:"LOG",         t:[232,233,238] },
};
const chN = +q[2], variant = q[3];
const T = CH[chN].t;
const tint = (a) => `rgba(${T[0]},${T[1]},${T[2]},${a})`;

function rng(seed){ let s = seed; return () => { s = (s*16807)%2147483647; return s/2147483647; }; }
const r = rng(q.charCodeAt(2)*7919 + q.charCodeAt(3)*104729 + 13);

/* ---------- signal designs ---------- */
const D = {};

D.ch1a = () => { // ignition rings — arcs radiating from a low ember core
  x.fillStyle="#0A0402"; x.fillRect(0,0,W,H);
  const cx=CX, cy=H*0.92;
  const core=x.createRadialGradient(cx,cy,0,cx,cy,W*0.45);
  core.addColorStop(0,"rgba(255,150,60,0.85)"); core.addColorStop(0.4,"rgba(200,60,10,0.30)"); core.addColorStop(1,"rgba(0,0,0,0)");
  x.fillStyle=core; x.fillRect(0,0,W,H);
  for(let i=1;i<=9;i++){
    const rr=i*W*0.075;
    x.strokeStyle=`rgba(${T[0]},${T[1]},${T[2]},${0.75-i*0.055})`;
    x.lineWidth=4.5-i*0.3; x.shadowColor=tint(0.8); x.shadowBlur=12;
    x.beginPath(); x.arc(cx,cy,rr,Math.PI*1.04,Math.PI*1.96); x.stroke();
  }
  x.shadowBlur=18;
  for(let e=0;e<26;e++){
    x.fillStyle=`rgba(255,${140+r()*80|0},50,${0.3+r()*0.6})`;
    x.beginPath(); x.arc(cx+(r()-0.5)*W*0.7, cy-r()*H*0.75, 1.5+r()*2.5, 0, 7); x.fill();
  }
};

D.ch1b = () => { // phosphor flame wisps
  x.fillStyle="#020703"; x.fillRect(0,0,W,H);
  for(let b=0;b<70;b++){
    const t=b/70;
    x.strokeStyle=tint(0.08+0.3*t); x.lineWidth=5+7*(1-t);
    x.shadowColor=tint(0.9); x.shadowBlur=15;
    const xb=W*(0.15+0.7*((b*89)%70)/70);
    x.beginPath();
    for(let i=0;i<=80;i++){
      const yy=H-(i/80)*H*(0.3+0.65*t);
      const sway=Math.sin(i*0.16+b*1.9)*W*0.045*(i/80)+Math.sin(i*0.33+b*0.7)*W*0.018;
      i?x.lineTo(xb+sway,yy):x.moveTo(xb+sway,yy);
    }
    x.stroke();
  }
};

D.ch1c = () => { // station test card — persona bars + circle + big CH numeral
  const cols=["#FF5C0D","#F2C76E","#6B8CFF","#EB1428","#FF4894","#E61E08","#C8C8C0"];
  for(let i=0;i<7;i++){ x.fillStyle=cols[i]; x.fillRect(i*W/7,0,W/7+1,H); }
  x.fillStyle="rgba(8,8,12,0.88)"; x.beginPath(); x.arc(CX,CY,H*0.34,0,7); x.fill();
  x.strokeStyle="#C8C8C0"; x.lineWidth=5; x.beginPath(); x.arc(CX,CY,H*0.34,0,7); x.stroke();
  x.fillStyle=tint(0.95); x.font=`700 ${H*0.30|0}px "Courier New",monospace`;
  x.textAlign="center"; x.textBaseline="middle"; x.shadowColor=tint(0.8); x.shadowBlur=22;
  x.fillText("01",CX,CY+H*0.01);
};

D.ch1d = () => { // slow lissajous knot
  x.fillStyle="#020703"; x.fillRect(0,0,W,H);
  x.strokeStyle=tint(0.85); x.lineWidth=3.5; x.shadowColor=tint(0.9); x.shadowBlur=14;
  x.beginPath();
  for(let i=0;i<=1200;i++){
    const t=i/1200*Math.PI*2;
    const px=CX+Math.sin(t*3+1.2)*W*0.33, py=CY+Math.sin(t*2)*H*0.33;
    i?x.lineTo(px,py):x.moveTo(px,py);
  }
  x.stroke();
  x.strokeStyle=tint(0.25); x.lineWidth=8; x.shadowBlur=0; x.stroke();
};

D.ch1e = () => { // typed ident, blinking cursor
  x.fillStyle="#020703"; x.fillRect(0,0,W,H);
  x.fillStyle=tint(0.95); x.font=`700 ${H*0.11|0}px "Courier New",monospace`;
  x.textAlign="left"; x.textBaseline="middle"; x.shadowColor=tint(0.7); x.shadowBlur=10;
  x.fillText("PERFORMING",W*0.10,H*0.40);
  x.fillText("FIRE",W*0.10,H*0.54);
  x.fillRect(W*0.10+x.measureText("FIRE").width+18,H*0.485,H*0.085,H*0.11);
  x.font=`400 ${H*0.045|0}px "Courier New",monospace`;
  x.fillStyle=tint(0.5);
  x.fillText("A BROADCAST IN FIVE CHANNELS",W*0.10,H*0.68);
};

D.ch2a = () => { // record ring — polar waveform + REC dot
  x.fillStyle="#08020A"; x.fillRect(0,0,W,H);
  x.strokeStyle=tint(0.5); x.lineWidth=2;
  x.beginPath(); x.arc(CX,CY,H*0.42,0,7); x.stroke();
  for(let i=0;i<48;i++){
    const a=i/48*Math.PI*2;
    x.beginPath();
    x.moveTo(CX+Math.cos(a)*H*0.42,CY+Math.sin(a)*H*0.42);
    x.lineTo(CX+Math.cos(a)*H*0.385,CY+Math.sin(a)*H*0.385);
    x.stroke();
  }
  x.strokeStyle=tint(0.95); x.lineWidth=4; x.shadowColor=tint(0.9); x.shadowBlur=14;
  x.beginPath();
  for(let i=0;i<=240;i++){
    const a=i/240*Math.PI*2;
    const wob=Math.sin(a*9)*0.35+Math.sin(a*21+1.3)*0.3+Math.sin(a*5)*0.3;
    const rr=H*0.27+wob*H*0.05;
    i?x.lineTo(CX+Math.cos(a)*rr,CY+Math.sin(a)*rr):x.moveTo(CX+Math.cos(a)*rr,CY+Math.sin(a)*rr);
  }
  x.closePath(); x.stroke();
  x.fillStyle="#FF2A18"; x.shadowColor="#FF2A18"; x.shadowBlur=22;
  x.beginPath(); x.arc(CX,CY,H*0.045,0,7); x.fill();
};

D.ch2b = () => { // tone bars — DTMF pulse cluster
  x.fillStyle="#08020A"; x.fillRect(0,0,W,H);
  const n=24;
  for(let i=0;i<n;i++){
    const hgt=(0.12+0.78*Math.abs(Math.sin(i*1.7)+Math.sin(i*0.53))/2)*H*0.72;
    const bw=W/n*0.55;
    x.fillStyle=tint(0.25+0.65*(hgt/(H*0.72)));
    x.shadowColor=tint(0.8); x.shadowBlur=10;
    x.fillRect(W*0.06+i*(W*0.88/n), CY+H*0.30-hgt, bw, hgt);
  }
  x.fillStyle=tint(0.9); x.fillRect(W*0.06,CY+H*0.315,W*0.88,3);
};

D.ch2c = () => { // incoming — pulse ring bursts
  x.fillStyle="#08020A"; x.fillRect(0,0,W,H);
  for(let g=0;g<2;g++){
    const gx=W*(0.32+g*0.36), gy=CY;
    for(let i=0;i<5;i++){
      x.strokeStyle=tint(0.85-i*0.17); x.lineWidth=5-i*0.8;
      x.shadowColor=tint(0.8); x.shadowBlur=12;
      x.beginPath(); x.arc(gx,gy,H*(0.06+i*0.075),0,7); x.stroke();
    }
    x.fillStyle=tint(0.95); x.beginPath(); x.arc(gx,gy,H*0.028,0,7); x.fill();
  }
};

D.ch2d = () => { // waveform rain
  x.fillStyle="#08020A"; x.fillRect(0,0,W,H);
  for(let col=0;col<16;col++){
    const cxx=W*0.05+col*W*0.058;
    x.strokeStyle=tint(0.25+r()*0.6); x.lineWidth=3;
    x.shadowColor=tint(0.7); x.shadowBlur=8;
    x.beginPath();
    let yy=-r()*H*0.4;
    for(let i=0;i<70;i++){
      const px=cxx+Math.sin(i*0.5+col)*7;
      yy+=H/70*1.2;
      i?x.lineTo(px,yy):x.moveTo(px,yy);
    }
    x.stroke();
  }
};

D.ch2e = () => { // voice hole — magenta static bloom
  const img=x.createImageData(W,H); const d=img.data;
  for(let i=0;i<d.length;i+=4){
    const v=r()*(r()>0.7?1:0.3);
    d[i]=T[0]*v*0.55; d[i+1]=T[1]*v*0.35; d[i+2]=T[2]*v*0.55; d[i+3]=255;
  }
  x.putImageData(img,0,0);
  const g=x.createRadialGradient(CX,CY,0,CX,CY,H*0.42);
  g.addColorStop(0,"rgba(0,0,0,0.96)"); g.addColorStop(0.75,"rgba(0,0,0,0.75)"); g.addColorStop(1,"rgba(0,0,0,0)");
  x.fillStyle=g; x.beginPath(); x.arc(CX,CY,H*0.42,0,7); x.fill();
  x.fillStyle=tint(0.95); x.shadowColor=tint(0.9); x.shadowBlur=16;
  x.beginPath(); x.arc(CX,CY,H*0.03,0,7); x.fill();
};

D.ch3a = () => { // magnet-warped raster (amber)
  x.fillStyle="#070402"; x.fillRect(0,0,W,H);
  const PX=W*0.60,PY=H*0.34,F=W*0.24;
  x.strokeStyle=tint(0.8); x.lineWidth=2; x.shadowColor=tint(0.7); x.shadowBlur=6;
  for(let l=0;l<56;l++){
    const y0=l/55*H;
    x.beginPath();
    let lx=null, ly=null;
    for(let i=0;i<=160;i++){
      const px=i/160*W;
      const dx=px-PX, dy=y0-PY, d2=Math.hypot(dx,dy)||1;
      const f=Math.exp(-(d2*d2)/(2*F*F))*F*0.85;
      const ang=Math.atan2(dy,dx);
      const qx=px+Math.cos(ang+Math.PI/2)*f*0.9, qy=y0+Math.sin(ang+Math.PI/2)*f*0.9;
      if(lx===null || Math.hypot(qx-lx,qy-ly)>30) x.moveTo(qx,qy); else x.lineTo(qx,qy);
      lx=qx; ly=qy;
    }
    x.stroke();
  }
};

D.ch3b = () => { // glitch slices
  x.fillStyle="#070402"; x.fillRect(0,0,W,H);
  for(let i=0;i<40;i++){
    const y0=r()*H, hh=5+r()*36, off=(r()-0.5)*W*0.26, a=0.25+r()*0.6;
    x.fillStyle=tint(a*0.85); x.fillRect(off,y0,W,hh*0.8);
    x.fillStyle=`rgba(255,50,60,${a*0.3})`; x.fillRect(off-16,y0,W,hh*0.3);
    x.fillStyle=`rgba(50,130,255,${a*0.3})`; x.fillRect(off+16,y0+hh*0.4,W,hh*0.3);
  }
  for(let i=0;i<8;i++){ x.fillStyle="rgba(0,0,0,0.85)"; x.fillRect(0,r()*H,W,4+r()*9); }
};

D.ch3c = () => { // lissajous specimen grid
  x.fillStyle="#070402"; x.fillRect(0,0,W,H);
  const figs=[[1,2],[2,3],[3,4],[3,2],[4,5],[5,4]];
  figs.forEach((f,k)=>{
    const gx=W*(0.20+(k%3)*0.30), gy=H*(0.28+((k/3)|0)*0.44);
    x.strokeStyle=tint(0.85); x.lineWidth=2.5; x.shadowColor=tint(0.8); x.shadowBlur=9;
    x.beginPath();
    for(let i=0;i<=500;i++){
      const t=i/500*Math.PI*2;
      const px=gx+Math.sin(t*f[0]+1)*W*0.10, py=gy+Math.sin(t*f[1])*H*0.15;
      i?x.lineTo(px,py):x.moveTo(px,py);
    }
    x.stroke();
  });
};

D.ch3d = () => { // moiré interference
  x.fillStyle="#070402"; x.fillRect(0,0,W,H);
  x.lineWidth=1.6;
  for(const [ox,oy] of [[-W*0.06,0],[W*0.06,0]]){
    x.strokeStyle=tint(0.5); x.shadowColor=tint(0.4); x.shadowBlur=3;
    for(let i=1;i<44;i++){
      x.beginPath(); x.arc(CX+ox,CY+oy,i*11,0,7); x.stroke();
    }
  }
};

D.ch3e = () => { // burn test grid — flame blob eating a grid
  x.fillStyle="#070402"; x.fillRect(0,0,W,H);
  x.strokeStyle=tint(0.28); x.lineWidth=1;
  for(let gx=0;gx<W;gx+=36){ x.beginPath(); x.moveTo(gx,0); x.lineTo(gx,H); x.stroke(); }
  for(let gy=0;gy<H;gy+=36){ x.beginPath(); x.moveTo(0,gy); x.lineTo(W,gy); x.stroke(); }
  for(let b=0;b<200;b++){
    const a=r()*Math.PI*2, rr=Math.pow(r(),0.5)*H*0.30;
    const px=CX+Math.cos(a)*rr*1.35, py=CY+Math.sin(a)*rr;
    const v=1-rr/(H*0.30);
    x.fillStyle=`rgba(255,${60+160*v|0},20,${0.10+v*0.5})`;
    x.shadowColor="rgba(255,120,30,0.9)"; x.shadowBlur=13;
    x.beginPath(); x.arc(px,py,3+v*13,0,7); x.fill();
  }
};

D.ch4a = () => { // EPG — program guide grid, highlighted row, dash text
  x.fillStyle="#020608"; x.fillRect(0,0,W,H);
  const rows=7, top=H*0.14;
  x.fillStyle=tint(0.9); x.fillRect(0,0,W,H*0.10);
  x.fillStyle="#020608";
  for(let d=0;d<6;d++) x.fillRect(W*0.06+d*W*0.16,H*0.035,W*0.09,H*0.032);
  for(let ro=0;ro<rows;ro++){
    const y0=top+ro*(H-top)/rows;
    const hot=ro===2;
    if(hot){ x.fillStyle=tint(0.16); x.fillRect(0,y0,W,(H-top)/rows); }
    x.strokeStyle=tint(0.30); x.lineWidth=1.5;
    x.beginPath(); x.moveTo(0,y0); x.lineTo(W,y0); x.stroke();
    x.fillStyle=hot?tint(0.95):tint(0.45);
    x.fillRect(W*0.04,y0+14,W*0.075,10);
    let xx=W*0.16;
    while(xx<W*0.94){ const seg=W*(0.05+r()*0.10); x.fillRect(xx,y0+14,seg*0.8,10); xx+=seg; }
  }
  x.strokeStyle=tint(0.6); x.lineWidth=2;
  x.beginPath(); x.moveTo(W*0.14,top); x.lineTo(W*0.14,H); x.stroke();
};

D.ch4b = () => { // index card — ruled lines, typed dashes, red rule
  x.fillStyle="#0A0C10"; x.fillRect(0,0,W,H);
  x.fillStyle="#E8E4D8"; x.fillRect(W*0.07,H*0.09,W*0.86,H*0.82);
  x.strokeStyle="#B33"; x.lineWidth=3;
  x.beginPath(); x.moveTo(W*0.07,H*0.24); x.lineTo(W*0.93,H*0.24); x.stroke();
  x.strokeStyle="rgba(40,80,160,0.45)"; x.lineWidth=2;
  for(let l=0;l<8;l++){
    const y0=H*0.32+l*H*0.072;
    x.beginPath(); x.moveTo(W*0.07,y0); x.lineTo(W*0.93,y0); x.stroke();
  }
  x.fillStyle="#23242A";
  x.fillRect(W*0.11,H*0.155,W*0.34,H*0.035);
  for(let l=0;l<6;l++){
    let xx=W*0.11;
    const y0=H*0.288+l*H*0.072;
    while(xx<W*0.80){ const seg=W*(0.03+r()*0.09); x.fillRect(xx,y0,seg*0.75,H*0.022); xx+=seg; }
  }
};

D.ch4c = () => { // microfilm strip
  x.fillStyle="#020608"; x.fillRect(0,0,W,H);
  x.save(); x.translate(CX,CY); x.rotate(-0.06); x.translate(-CX,-CY);
  x.fillStyle="#0E1116"; x.fillRect(-40,H*0.18,W+80,H*0.62);
  for(let f=0;f<5;f++){
    const fx=W*0.035+f*W*0.195;
    x.fillStyle=tint(0.14); x.fillRect(fx,H*0.25,W*0.165,H*0.48);
    x.strokeStyle=tint(0.55); x.lineWidth=2; x.strokeRect(fx,H*0.25,W*0.165,H*0.48);
    x.fillStyle=tint(0.5);
    for(let l=0;l<7;l++){
      let xx=fx+10;
      while(xx<fx+W*0.150){ const seg=8+r()*22; x.fillRect(xx,H*0.29+l*H*0.058,seg*0.7,5); xx+=seg; }
    }
  }
  for(let s=0;s<26;s++){
    x.fillStyle="#020608";
    x.fillRect(W*0.018+s*W*0.038,H*0.195,W*0.017,H*0.030);
    x.fillRect(W*0.018+s*W*0.038,H*0.775,W*0.017,H*0.030);
  }
  x.restore();
};

D.ch4d = () => { // punch-dot data constellation
  x.fillStyle="#020608"; x.fillRect(0,0,W,H);
  for(let col=0;col<30;col++)for(let ro=0;ro<20;ro++){
    const on=r()>0.62;
    const px=W*0.05+col*W*0.031, py=H*0.07+ro*H*0.045;
    x.fillStyle=on?tint(0.85):tint(0.13);
    if(on){ x.shadowColor=tint(0.8); x.shadowBlur=7; } else x.shadowBlur=0;
    x.beginPath(); x.arc(px,py,on?4:2.5,0,7); x.fill();
  }
  x.shadowBlur=0;
};

D.ch4e = () => { // cyan polar waveform
  x.fillStyle="#020608"; x.fillRect(0,0,W,H);
  x.strokeStyle=tint(0.5); x.lineWidth=2;
  x.beginPath(); x.arc(CX,CY,H*0.40,0,7); x.stroke();
  x.strokeStyle=tint(0.95); x.lineWidth=4; x.shadowColor=tint(0.9); x.shadowBlur=13;
  x.beginPath();
  for(let i=0;i<=240;i++){
    const a=i/240*Math.PI*2;
    const wob=Math.sin(a*7)*0.4+Math.sin(a*17+0.7)*0.3;
    const rr=H*0.26+wob*H*0.05;
    i?x.lineTo(CX+Math.cos(a)*rr,CY+Math.sin(a)*rr):x.moveTo(CX+Math.cos(a)*rr,CY+Math.sin(a)*rr);
  }
  x.closePath(); x.stroke();
};

D.ch5a = () => { // flip digits 07·23
  x.fillStyle="#0A0A0C"; x.fillRect(0,0,W,H);
  const dw=W*0.19,dh=H*0.52,gap=W*0.025,y0=H*0.24;
  const digits=["0","7","2","3"];
  digits.forEach((dg,i)=>{
    const px=W*0.08+i*(dw+gap)+(i>1?W*0.04:0);
    x.fillStyle="#17181D"; x.fillRect(px,y0,dw,dh);
    x.strokeStyle="#2A2B33"; x.lineWidth=2; x.strokeRect(px,y0,dw,dh);
    x.fillStyle="#0A0A0C"; x.fillRect(px,y0+dh/2-2,dw,4);
    x.fillStyle=tint(0.95); x.font=`700 ${dh*0.72|0}px "Courier New",monospace`;
    x.textAlign="center"; x.textBaseline="middle";
    x.fillText(dg,px+dw/2,y0+dh*0.54);
  });
  x.fillStyle=tint(0.85);
  x.beginPath(); x.arc(W*0.50,y0+dh*0.35,6,0,7); x.fill();
  x.beginPath(); x.arc(W*0.50,y0+dh*0.65,6,0,7); x.fill();
};

D.ch5b = () => { // tally field
  x.fillStyle="#0A0A0C"; x.fillRect(0,0,W,H);
  x.strokeStyle=tint(0.8); x.lineWidth=4; x.lineCap="round"; x.shadowColor=tint(0.5); x.shadowBlur=6;
  let count=0;
  for(let ro=0;ro<5;ro++)for(let g=0;g<6;g++){
    const gx=W*0.09+g*W*0.145, gy=H*0.14+ro*H*0.17;
    const n=(count<26)?5:(r()*5|0)+1; count++;
    for(let i=0;i<Math.min(n,4);i++){
      x.beginPath(); x.moveTo(gx+i*13,gy); x.lineTo(gx+i*13,gy+H*0.10); x.stroke();
    }
    if(n>=5){ x.beginPath(); x.moveTo(gx-8,gy+H*0.085); x.lineTo(gx+3*13+8,gy+H*0.015); x.stroke(); }
  }
};

D.ch5c = () => { // moon phases row
  x.fillStyle="#0A0A0C"; x.fillRect(0,0,W,H);
  for(let i=0;i<8;i++){
    const px=W*0.085+i*W*0.118, py=CY, rr=H*0.072;
    x.fillStyle="#26272C"; x.beginPath(); x.arc(px,py,rr,0,7); x.fill();
    const ph=i/7;
    x.fillStyle=tint(0.9); x.shadowColor=tint(0.5); x.shadowBlur=10;
    x.beginPath();
    if(ph<=0.5){
      const k=ph*2;
      x.arc(px,py,rr,-Math.PI/2,Math.PI/2);
      x.ellipse(px,py,rr*(1-k*2<0?k*2-1:1-k*2)*((k<0.5)?1:1),rr,0,Math.PI/2,-Math.PI/2,k<0.5);
    } else {
      const k=(ph-0.5)*2;
      x.arc(px,py,rr,Math.PI/2,-Math.PI/2);
      x.ellipse(px,py,rr*Math.abs(1-k*2),rr,0,-Math.PI/2,Math.PI/2,k>0.5);
    }
    x.fill(); x.shadowBlur=0;
  }
};

D.ch5d = () => { // burn-down trace — descending ember line
  x.fillStyle="#0A0A0C"; x.fillRect(0,0,W,H);
  x.strokeStyle=tint(0.25); x.lineWidth=1;
  for(let gy=0;gy<6;gy++){ const y0=H*0.12+gy*H*0.15;
    x.beginPath(); x.moveTo(W*0.06,y0); x.lineTo(W*0.94,y0); x.stroke(); }
  x.strokeStyle=tint(0.9); x.lineWidth=3.5; x.shadowColor=tint(0.6); x.shadowBlur=8;
  x.beginPath();
  let py=H*0.16;
  for(let i=0;i<=60;i++){
    const px=W*0.06+i/60*W*0.88;
    py+=r()*H*0.022-(H*0.002);
    x.lineTo(px,Math.min(py,H*0.86)); if(!i)x.moveTo(px,py);
  }
  x.stroke();
  x.fillStyle="#FF7A28"; x.shadowColor="#FF7A28"; x.shadowBlur=18;
  x.beginPath(); x.arc(W*0.94,Math.min(py,H*0.86),6,0,7); x.fill();
};

D.ch5e = () => { // sign-off — CRT collapse to a dot
  x.fillStyle="#050506"; x.fillRect(0,0,W,H);
  const g=x.createLinearGradient(0,CY-4,0,CY+4);
  g.addColorStop(0,"rgba(255,255,255,0)"); g.addColorStop(0.5,"rgba(255,255,255,0.9)"); g.addColorStop(1,"rgba(255,255,255,0)");
  x.fillStyle=g; x.fillRect(W*0.06,CY-4,W*0.88,8);
  x.fillStyle="rgba(255,255,255,0.97)"; x.shadowColor="#FFF"; x.shadowBlur=30;
  x.beginPath(); x.arc(CX,CY,9,0,7); x.fill();
  x.shadowBlur=60; x.beginPath(); x.arc(CX,CY,4,0,7); x.fill();
};

/* ---------- draw + CRT dressing ---------- */
D[q]();

// scanlines
x.shadowBlur=0;
x.fillStyle="rgba(0,0,0,0.24)";
for(let y=0;y<H;y+=3) x.fillRect(0,y,W,1);
// vignette
const v=x.createRadialGradient(CX,CY,H*0.25,CX,CY,H*0.85);
v.addColorStop(0,"rgba(0,0,0,0)"); v.addColorStop(1,"rgba(0,0,0,0.5)");
x.fillStyle=v; x.fillRect(0,0,W,H);
// glass highlight
const gl=x.createRadialGradient(CX,-H*0.4,0,CX,-H*0.4,H*1.1);
gl.addColorStop(0,"rgba(255,255,255,0.10)"); gl.addColorStop(0.55,"rgba(255,255,255,0.02)"); gl.addColorStop(1,"rgba(0,0,0,0)");
x.fillStyle=gl; x.fillRect(0,0,W,H);
// OSD chip
const label=`CH 0${chN} · ${CH[chN].name}`;
x.font=`700 ${H*0.062|0}px "Courier New",monospace`;
x.textAlign="left"; x.textBaseline="middle";
const tw=x.measureText(label).width;
x.fillStyle="rgba(4,4,7,0.78)";
x.fillRect(W*0.045,H*0.795,tw+34,H*0.115);
x.fillStyle=tint(0.97); x.shadowColor=tint(0.8); x.shadowBlur=9;
x.fillText(label,W*0.045+17,H*0.855);
x.shadowBlur=0;
// rounded tube mask
x.globalCompositeOperation="destination-in";
x.beginPath();
const R2=54;
x.moveTo(R2,0); x.lineTo(W-R2,0); x.quadraticCurveTo(W,0,W,R2);
x.lineTo(W,H-R2); x.quadraticCurveTo(W,H,W-R2,H);
x.lineTo(R2,H); x.quadraticCurveTo(0,H,0,H-R2);
x.lineTo(0,R2); x.quadraticCurveTo(0,0,R2,0);
x.closePath(); x.fill();
x.globalCompositeOperation="source-over";
document.title="BAKED-"+q;
