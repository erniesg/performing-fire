  :root {
    --g: #37ff8b; --m: #ff3ea5; --a: #ffb300; --c: #2bd9ff; --w: #e8e9ee;
    --ink: #c9cbd4; --dim: #6b6f7c;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { scroll-behavior: auto; }
  body {
    background: #030404; color: var(--ink);
    font-family: "VT323", "SF Mono", "IBM Plex Mono", ui-monospace, Menlo, monospace;
    overflow-x: hidden;
  }
  body.locked { overflow: hidden; }
  #gl { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #scanlines {
    position: fixed; inset: 0; z-index: 5; pointer-events: none;
    background: repeating-linear-gradient(0deg, rgba(0,0,0,.18) 0 1px, transparent 1px 3px);
    mix-blend-mode: soft-light; opacity: .9;
  }
  .space { height: 620vh; }
  body.reduced .space { height: 100vh; }

  /* ---------- HUD (visible from first paint — the landing IS informative) ---------- */
  .hud {
    position: fixed; z-index: 10; left: 0; right: 0; top: 0;
    padding: 26px 30px 0; pointer-events: none;
    display: flex; flex-direction: column; gap: 10px;
    transition: opacity .4s;
  }
  .hud h1 {
    font-size: clamp(34px, 6vw, 72px); letter-spacing: .06em; color: var(--w);
    text-shadow: 0 0 22px rgba(55,255,139,.35), 0 0 2px rgba(255,255,255,.6);
    transform-origin: left top;
    transition: font-size .6s cubic-bezier(.22,1,.3,1);
  }
  .hud h1 .eps { color: var(--g); }
  .hud .tag {
    /* dark ink — the locked MOONJAR clay is LIGHT, and the teletext grey
       (--ink) disappeared into it */
    max-width: 62ch; font-size: 13px; line-height: 1.65; color: #3b352b;
    text-shadow: 0 1px 0 rgba(240,232,214,.4);
    transition: opacity .5s, transform .5s;
  }
  body.docked .hud h1 { font-size: clamp(2rem, 3.2vw, 3rem); }
  body.docked .hud .tag { opacity: 0; transform: translateY(-6px); pointer-events: none; }
  body.paged .hud .tag { opacity: 0; }        /* index stays live in page mode — it is the channel switcher */

  /* teletext index — the channels are PAGES of the broadcast (P101–P105) */
  .tt-head { display: flex; flex-direction: column; gap: 7px; pointer-events: none; transition: opacity .4s; }
  .tt-bars { display: flex; height: 7px; width: min(520px, 62vw); }
  .tt-bars i { flex: 1; }
  .tt-line {
    font-size: 11px; letter-spacing: .2em; color: #e8e9ee; display: flex; gap: 20px;
    text-shadow: 1px 1px 0 rgba(255,62,165,.5);
  }

<script>
(function () {
  "use strict";

  /* ================= channel metadata ================= */
  const TINT = { 1: "#37ff8b", 2: "#ff3ea5", 3: "#ffb300", 4: "#2bd9ff", 5: "#e8e9ee" };

    { ch: 1, key: "g7", name: "ABOUT",       device: "oscilloscope", kicker: "THIS IS PERFORMING FIRE · APE LAB 2026 · TRACK B (PAIK NAM JUNE)",

      title: "FEED THE FIRE.",
      body: ["Offerings rise through the raster. Voices join the pulse.", "Placeholder copy — contribution flow renders here."] },
    { ch: 3, key: "x3", name: "EXPERIMENTS", device: "vectorscope", kicker: "CH 03 · LOG",

      title: "MOON PHASES.",
      body: ["Long-persistence phosphor. The slow diary of the project.", "Placeholder copy — the log renders here."] },
  ];
  const specFor = k => (window.PF_ANIMS || []).find(a => a.key === k);
  const mkRnd = seed => { let s = seed; return () => { s = (s * 16807) % 2147483647; return s / 2147483647; }; };
  const sm = (a, b, x) => { const u = Math.min(1, Math.max(0, (x - a) / (b - a))); return u * u * (3 - 2 * u); };
  const lerp = (a, b, u) => a + (b - a) * u;

  const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
  if (reduced) document.body.classList.add("reduced");

  /* HUD channel index — built before any WebGL so the landing stays informative even on failure.

  const idx = document.querySelector(".idx");
  {
    const tt = document.createElement("div");
    tt.className = "tt-head";
    tt.innerHTML = "<div class=\"tt-bars\">" +
      ["#e8e9ee", "#ffe25a", "#2bd9ff", "#37ff8b", "#ff3ea5", "#ff5a3c", "#8b5aff"]
        .map(c => `<i style="background:${c}"></i>`).join("") +
      "</div><div class=\"tt-line\"><span>P100</span><span>PFIRE 1</span><span id=\"ttclock\"></span></div>";
    idx.parentNode.insertBefore(tt, idx);
    const ttclock = tt.querySelector("#ttclock");
    const DAYS = ["SUN", "MON", "TUE", "WED", "THU", "FRI", "SAT"];
    const MONS = ["JAN", "FEB", "MAR", "APR", "MAY", "JUN", "JUL", "AUG", "SEP", "OCT", "NOV", "DEC"];
    const p2 = n => String(n).padStart(2, "0");
    (function ttTick() {
      const d = new Date();
      ttclock.textContent = `${DAYS[d.getDay()]} ${p2(d.getDate())} ${MONS[d.getMonth()]} ${p2(d.getHours())}:${p2(d.getMinutes())}/${p2(d.getSeconds())}`;
      setTimeout(ttTick, 1020 - d.getMilliseconds());        // ticks on the second, like the real service
    })();
  }
  CHAN.forEach(c => {
    const b = document.createElement("button");
    b.style.setProperty("--tint", TINT[c.ch]);
    b.innerHTML = `<span class="pg">P10${c.ch}</span>${c.name}`;
    b.setAttribute("aria-label", `Channel ${c.ch} · ${c.name}`);
    b.addEventListener("click", () => tuneTo(c.ch));

  });
  const cue = document.getElementById("cue");
  addEventListener("error", e => {
    cue.textContent = `ERR: ${e.message} @ ${(e.filename || "").split("/").pop()}:${e.lineno}`;
  });

  /* ================= renderer / scene ================= */
  let renderer;
  try {
    renderer = new THREE.WebGLRenderer({ canvas: document.getElementById("gl"), antialias: true });
  } catch (e) {
    const msg = document.createElement("p");
    msg.className = "fail";
    msg.textContent = "WebGL unavailable — this prototype needs GPU rendering. Open in a normal desktop browser.";
    document.body.appendChild(msg);
    return;
  }
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.0;

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x030405).convertSRGBToLinear();  // post pass re-encodes; keep blacks black
  /* fog fades to TRUE black, not scene-black: a chromatic near-black fog color
     quantizes per-channel on the floor gradient (red drops out first) and left a
     cyan stripe burned across the mid-distance — and it lifted every midground
     silhouette LIGHTER than the backdrop it stands against */
  scene.fog = new THREE.FogExp2(0x000000, 0.036);          // 0.042 ate ~half the midground ring — silhouettes vanished

  /* soft studio environment — gives metals and varnish something to reflect */
  {
    const pmrem = new THREE.PMREMGenerator(renderer);
    const env = new THREE.Scene();
    env.background = new THREE.Color(0x000000);
    const panel = (c, w, h, pos, rot) => {
      const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({ color: c }));
      m.position.set(...pos); m.rotation.set(...rot);
      env.add(m);
    };
    /* near-neutral panels: saturated ones tint the cabinets green and blue in patches,
       which reads as uneven colour once the dither quantizes it */
    panel(0xf0e6d8, 7, 4, [0, 6, 1], [Math.PI / 2, 0, 0]);      // softbox above
    panel(0x1c211e, 5, 3, [0, 2, 6], [0, Math.PI, 0]);          // faint spill from the front
    panel(0x1b1e24, 6, 4, [-6, 2, 0], [0, Math.PI / 2, 0]);     // cool fill left
    panel(0xffffff, 5, 0.35, [2, 5, 3], [Math.PI / 2.4, 0, 0]); // hot strip — chrome needs an edge to catch
    scene.environment = pmrem.fromScene(env, 0.05).texture;
    pmrem.dispose();
  }

  /* near 0.4 is load-bearing: the post RT's depth buffer is 16-bit, and depth
     precision scales with the near plane — at 0.05 the whole hero view fell
     inside one depth step and every close-stacked decal z-fought */
  const cam = new THREE.PerspectiveCamera(38, innerWidth / innerHeight, 0.4, 80);
  cam.position.set(0, 2.6, 10.5);

  const amb = new THREE.AmbientLight(0x25282f, 0.7);
  const key = new THREE.DirectionalLight(0xffd9a0, 0);           // revealed by the power-on flash
  key.position.set(3.5, 6, 4.5);
  const rim = new THREE.DirectionalLight(0x3a4a66, 0.22);
  rim.position.set(-4, 2.5, -5);
  scene.add(amb, key, rim);

  /* floor fades radially to scene-black — grounds the console, never a visible horizon */
  const floorCv = document.createElement("canvas");
  floorCv.width = floorCv.height = 256;
  {
    const fx = floorCv.getContext("2d");
    const fg = fx.createRadialGradient(128, 128, 0, 128, 128, 128);
    /* pool centre must CLEAR the post quantizer (12 levels ≈ steps of 23) —
       rgb(16,…) rounded to pure black and the whole bench floated on a void */
    fg.addColorStop(0, "rgb(30,31,34)");
    fg.addColorStop(0.10, "rgb(13,14,16)");
    fg.addColorStop(0.24, "rgb(0,0,0)");                     // wide enough that the TV towers sit in it too
    fg.addColorStop(1, "rgb(0,0,0)");
    fx.fillStyle = fg; fx.fillRect(0, 0, 256, 256);
  }
  const floorTex = new THREE.CanvasTexture(floorCv);
  floorTex.encoding = THREE.sRGBEncoding;
  const floor = new THREE.Mesh(
    /* 90 is load-bearing: half-extent must beat the sky dome's radius (38) so the
       floor hides the dome below the equator from every eye height — at 60 the
       below-horizon half peeked past the floor edge as a hard lit seam */
    new THREE.PlaneGeometry(90, 90),
    /* UNLIT — a lit floor turns every light into grey wash and colored blobs;
       this one is only its baked pool, fading to exact scene black.
       fog:false — black fog on the black floor was invisible, but it burned a
       dark band across MOONJAR's porcelain ground at the horizon */
    new THREE.MeshBasicMaterial({ map: floorTex, fog: false })
  );
  floor.rotation.x = -Math.PI / 2;
  scene.add(floor);

  const console3d = new THREE.Group();                            // yaws as one totem
  scene.add(console3d);

  /* reality-field wobble — the scene refracts around the cursor; stirring it bends space */
  const rtSize = new THREE.Vector2();
  renderer.getDrawingBufferSize(rtSize);
  /* r140 renders into targets in LINEAR — the post shader re-encodes. Half float is
     load-bearing: in 8 bits the linear round trip crushes every dim glow (screen
     bloom, comet tails, halo falloff) to 0-2/255 — hard dots, no fire */
  const rt = new THREE.WebGLRenderTarget(rtSize.x, rtSize.y, { type: THREE.HalfFloatType });
  /* NO rt.depthTexture here. r140 gives render targets a 16-BIT depth renderbuffer,
     and attaching a 24-bit DepthTexture instead corrupts in GPU-tile-sized squares
     on macOS ANGLE/Metal (stale tile depth + hatching). We live with 16 bits: the
     camera near plane is 0.4 (precision ~ near×2^16), and anything stacked closer
     than ~0.005 world units at hero distance would z-fight — decal stacks keep
     their layer gaps at 0.03+ */
  const postCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
  const postMat = new THREE.ShaderMaterial({
    uniforms: {
      tDiffuse: { value: rt.texture },
      uMouse: { value: new THREE.Vector2(0.5, 0.5) },
      uRes: { value: new THREE.Vector2(rtSize.x, rtSize.y) },
      uTime: { value: 0 }, uAmp: { value: 0 }, uAspect: { value: 1 },
      uPix: { value: 1 },      // 1 = no pixelization: >1 stair-steps every geometry edge and shimmers on motion
      uLevels: { value: 12 },
    },
    vertexShader: `varying vec2 vUv; void main() { vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }`,
    /* retro grade after https://blog.maximeheckel.com/posts/the-art-of-dithering-and-retro-shading-web/ :
       virtual pixel grid → wobble/chromatic sample → gamma → ordered Bayer dither + color quantization */
    fragmentShader: `
      uniform sampler2D tDiffuse; uniform vec2 uMouse, uRes;
      uniform float uTime, uAmp, uAspect, uPix, uLevels;
      varying vec2 vUv;
      float bayer2(vec2 a) { a = floor(a); return fract(a.x / 2.0 + a.y * a.y * 0.75); }
      float bayer4(vec2 a) { return bayer2(0.5 * a) * 0.25 + bayer2(a); }
      float bayer8(vec2 a) { return bayer4(0.5 * a) * 0.25 + bayer2(a); }
      void main() {
        vec2 cell = floor(gl_FragCoord.xy / uPix);
        vec2 uv0 = (cell * uPix + uPix * 0.5) / uRes;        // virtual CRT pixels
        vec2 d = uv0 - uMouse; d.x *= uAspect;
        float r = length(d);
        float rip = sin(r * 30.0 - uTime * 4.5) * exp(-r * 4.5);
        float haze = sin(uv0.y * 52.0 + uTime * 2.3) * sin(uv0.x * 41.0 - uTime * 1.7) * exp(-r * 3.0);
        vec2 off = (normalize(d + 1e-5) * rip + vec2(haze, -haze) * 0.35) * uAmp;
        vec2 uv = uv0 + off;
        float ca = uAmp * 0.55 * (0.5 + abs(rip));
        vec3 col;
        col.r = texture2D(tDiffuse, uv + vec2(ca, 0.0)).r;
        col.g = texture2D(tDiffuse, uv).g;
        col.b = texture2D(tDiffuse, uv - vec2(ca, 0.0)).b;
        col = pow(col, vec3(0.4545));
        float th = bayer8(cell) - 0.5;                       // ordered dithering, locked to the pixel grid
        /* fade dither in across dark tones — on large near-black flats (the recess
           walls) full-strength ordered dither prints its own matrix as a dot grid */
        float lum = dot(col, vec3(0.2126, 0.7152, 0.0722));
        /* full-step spread (1.0/12 still under the 1/(levels-1) dot-grid
           ceiling) — at 0.85 the dither covered only ~78% of a level, so
           quantize contours printed through on light fields (moonjar clay) */
        col += th * (1.0 / uLevels) * smoothstep(0.004, 0.10, lum);
        col = floor(col * (uLevels - 1.0) + 0.5) / (uLevels - 1.0);
        /* tv screens tagged alpha 0 stay clean, full-res, undithered */
        vec4 fullTap = texture2D(tDiffuse, vUv + off);
        vec3 screenCol = pow(fullTap.rgb, vec3(0.4545));
        gl_FragColor = vec4(mix(screenCol, col, fullTap.a), 1.0);
      }`,
    depthTest: false, depthWrite: false,
  });
  const postScene = new THREE.Scene();
  postScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), postMat));
  let wobbleV = 0;

  /* ================= screen canvas helpers ================= */
  const SIDE_STILL_T = 1.7;
  function makeScreen(w, h, opts) {
    const cv = document.createElement("canvas");
    cv.width = w; cv.height = h;
    const ctx = cv.getContext("2d");
    const tex = new THREE.CanvasTexture(cv);
    tex.encoding = THREE.sRGBEncoding;

      cv, ctx, tex, st: {}, rndSeed: opts.seed || 7, power: 0, onAt: -1,
      bootAt: -1, phase: "off", frameReady: false,
      signalT: SIDE_STILL_T, liveAt: -1, liveFrom: SIDE_STILL_T,
    }, opts);
  }
  function drawGlassOff(s) {
    const { ctx: x, cv } = s, W = cv.width, H = cv.height;
    x.setTransform(1, 0, 0, 1, 0, 0);
    x.fillStyle = "#05070a"; x.fillRect(0, 0, W, H);
    const g = x.createLinearGradient(0, 0, W, H);
    g.addColorStop(0, "rgba(120,140,170,0.10)"); g.addColorStop(0.35, "rgba(0,0,0,0)");
    x.fillStyle = g; x.fillRect(0, 0, W, H);
  }
  function drawStatic(s) {
    const { ctx: x, cv } = s, W = cv.width, H = cv.height;
    x.fillStyle = "#060708"; x.fillRect(0, 0, W, H);
    for (let i = 0; i < 420; i++) {
      const v = 0.15 + Math.random() * 0.5;
      x.fillStyle = `rgba(220,228,235,${v})`;
      x.fillRect(Math.random() * W, Math.random() * H, 2, 1.4);
    }
  }
  function overlayCRT(s, tint, labelText, labelProgress, centered) {
    const { ctx: x, cv } = s, W = cv.width, H = cv.height;
    x.save();
    x.globalAlpha = 1;
    if (centered !== "top") {                                // NEVER on the master: translucent overlays accumulate on its persistence canvas
      const vg = x.createRadialGradient(W / 2, H / 2, H * 0.35, W / 2, H / 2, H * 0.85);
      vg.addColorStop(0, "rgba(0,0,0,0)"); vg.addColorStop(1, "rgba(0,0,0,0.42)");
      x.fillStyle = vg; x.fillRect(0, 0, W, H);
    }
    if (labelText && labelProgress > 0) {
      const nChars = Math.max(0, Math.ceil(labelText.length * Math.min(1, labelProgress)));
      const txt = labelText.slice(0, nChars);
      if (txt) {
        x.font = `${Math.round(H * 0.062)}px ui-monospace, Menlo, monospace`;
        const padX = H * 0.045, tw = x.measureText(txt).width;
        let lx, ly, plateA;

        x.beginPath(); x.moveTo(0, gy); x.lineTo(W, gy); x.stroke();
      }
    });
  }

  /* ================= device construction ================= */
  /* clean shells — every attempt at procedural surface detail (speckle, brush, mottle)
     has read as dirt or blotches at some angle; flat + env reflection is the honest look */
  const matBody = base => new THREE.MeshStandardMaterial({
    color: new THREE.Color(base), roughness: 0.86, metalness: 0.04, envMapIntensity: 0.35,   // honest matte
  });
  const matDark = matBody("#181b21", 41);
  const matWood = new THREE.MeshStandardMaterial({ map: woodTex, bumpMap: woodTex, bumpScale: 0.005, roughness: 0.66, metalness: 0.04, envMapIntensity: 0.18 });
  const darkVeneerTex = canvasTex(512, 512, (x, W, H) => {
    x.fillStyle = "#2b1a0a"; x.fillRect(0, 0, W, H);
    const rr = mkRnd(29);
    for (let i = 0; i < 150; i++) {
      const gx = rr() * W, dark = rr() > 0.45;
      x.strokeStyle = dark ? `rgba(12,7,3,${0.08 + rr() * 0.14})` : `rgba(84,54,26,${0.05 + rr() * 0.1})`;
      x.lineWidth = 1 + rr() * 2.4;
      x.beginPath(); x.moveTo(gx, 0);
      for (let yy = 32; yy <= H; yy += 32) x.lineTo(gx + Math.sin(yy * 0.018 + i * 2.3) * (2 + rr() * 6), yy);
      x.stroke();
    }
  });
  const matWoodDark = new THREE.MeshStandardMaterial({ map: darkVeneerTex, bumpMap: darkVeneerTex, bumpScale: 0.008, roughness: 0.68, metalness: 0.05, envMapIntensity: 0.4 });
  /* knob materials are marked CLEAN in the post pass (alpha 0, same trick as the
     screens): small bright shapes re-rasterize under dither+quantization on every
     sub-pixel camera move, so knobs flickered no matter what material they wore */
  const markClean = m => {
    m.onBeforeCompile = sh => {
      sh.fragmentShader = sh.fragmentShader.replace(/\}\s*$/, "gl_FragColor.a = 0.0;\n}");
    };
    return m;
  };
  const matKnob = markClean(new THREE.MeshStandardMaterial({ color: 0x84888f, roughness: 0.18, metalness: 0.95, envMapIntensity: 1.5 }));   // chrome
  const matRimStable = markClean(new THREE.MeshBasicMaterial({ color: 0x555a60 }));   // unlit — cannot re-shade, cannot shift
  /* knob parts are UNLIT flat color + clean-masked: any lit material re-shades as
     the console yaws with the pointer, so knobs could never hold still */
  const matKnobRing = markClean(new THREE.MeshBasicMaterial({ color: 0x0a0a0c }));
  const matTick = markClean(new THREE.MeshBasicMaterial({ color: 0xd8d2c0 }));
  const matBezel = new THREE.MeshStandardMaterial({ color: 0x0c0a08, roughness: 0.75, metalness: 0.12, envMapIntensity: 0.25 });

  function cabinet(g, w, h, d, mat, plateMat) {
    const body = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
    g.add(body);
    const plate = new THREE.Mesh(new THREE.BoxGeometry(w * 0.94, h * 0.94, 0.05), plateMat || matDark);
    plate.position.z = d / 2 + 0.011;
    g.add(plate);
    return body;
  }
  function knob(g, kx, ky, kz, r, opts) {
    const o = opts || {};
    const grp = new THREE.Group();
    if (o.flat) {
      /* a 2D decal knob — flat discs only, NO depth. A 3D knob in flat unlit color
         morphs its outline as the console yaws (the cylinder's side wall renders
         the same color as the face), so the master knobs could never hold still */
      /* layer gaps 0.03+ — the RT depth buffer is 16-bit, so anything closer
         z-fights and the rim repaints as roaming white arcs (the knob saga's
         true culprit; it was never the materials) */
      const ring = new THREE.Mesh(new THREE.CircleGeometry(r * 1.5, 28), matKnobRing);
      const rim = new THREE.Mesh(new THREE.RingGeometry(r * 0.86, r * 1.12, 28), matRimStable);
      rim.position.z = 0.03;
      const face = new THREE.Mesh(new THREE.CircleGeometry(r * 0.86, 28), o.mat || matKnobRing);
      face.position.z = 0.06;
      const tick2 = new THREE.Mesh(new THREE.PlaneGeometry(0.022, r * 0.6), matTick);
      tick2.position.set(0, r * 0.44, 0.09);
      grp.add(ring, rim, face, tick2);
    } else {
      const ring = new THREE.Mesh(new THREE.CylinderGeometry(r * 1.5, r * 1.5, 0.016, 24), matKnobRing);
      ring.rotation.x = Math.PI / 2; ring.position.z = 0.03;   // clear of the plate — 16-bit depth can't split a 0.008 gap
      const body = new THREE.Mesh(new THREE.CylinderGeometry(r * 0.94, r * 1.18, 0.085, 24), o.mat || matKnob);
      body.rotation.x = Math.PI / 2; body.position.z = 0.075;
      const tick = new THREE.Mesh(new THREE.BoxGeometry(0.022, r * 0.6, 0.002), matTick);
      tick.position.set(0, r * 0.44, 0.15);
      grp.add(ring, body, tick);
    }
    grp.position.set(kx, ky, kz);
    grp.rotation.z = o.rot !== undefined ? o.rot : Math.sin(kx * 12.9 + ky * 78.2) * Math.PI;   // default: left at a random setting
    g.add(grp);
  }
  const SCREEN_VERT = `varying vec2 vUv; void main() { vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`;
  const PLAIN_FRAG = `
    uniform sampler2D map; uniform float uTime, uF, uA;
    varying vec2 vUv;
    void main() {
      vec3 c = pow(texture2D(map, vUv).rgb, vec3(2.2));
      float scan = 1.0 - uA * (0.5 + 0.5 * sin(vUv.y * uF + uTime * 4.0));
      gl_FragColor = vec4(c * scan, 0.0);                    // alpha 0 = "screen" mask: the post pass skips dithering here
    }`;
  /* the master's fire is a real shader: fbm flame in two parallax layers, ember bed,
     back-wall glow and floor reflection — the canvas only supplies embers/characters/labels */
  const FIRE_FRAG = `
    uniform sampler2D map; uniform float uTime, uF, uA, uFlame;
    varying vec2 vUv;
    float hash(vec2 p) { return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
    float noise(vec2 p) {
      vec2 i = floor(p), f = fract(p);
      f = f * f * (3.0 - 2.0 * f);
      return mix(mix(hash(i), hash(i + vec2(1.0, 0.0)), f.x),
                 mix(hash(i + vec2(0.0, 1.0)), hash(i + vec2(1.0, 1.0)), f.x), f.y);
    }
    float fbm(vec2 p) {
      float v = 0.0, a = 0.5;
      for (int i = 0; i < 4; i++) { v += a * noise(p); p *= 2.03; a *= 0.5; }
      return v;
    }
    vec3 fireBody(vec2 uv, float tt, float sc, float off) {
      float sway = sin(tt * 1.9 + off) * 0.05 + sin(tt * 3.3 + off * 2.0) * 0.025;
      vec2 p = vec2(((uv.x - 0.5) - sway * (uv.y - 0.12)) * 3.6 / sc, (uv.y - 0.12) * 2.2 / sc);
      if (p.y < -0.15 || p.y > 1.7) return vec3(0.0);
      float n = fbm(vec2(p.x * 1.6 + off * 5.0, p.y * 2.4 - tt * 1.9))
              + 0.4 * fbm(vec2(p.x * 3.4 + off * 5.0 + 4.7, p.y * 4.2 - tt * 3.1));
      n /= 1.4;
      /* narrow teardrop, strongly eroded — licks and gaps, not a solid triangle */
      float shape = 1.0 - length(vec2(p.x * (1.0 + p.y * 0.6), p.y * 0.6 - 0.16));
      float inten = clamp((shape + (n - 0.5) * 1.0) * 1.35, 0.0, 1.0);
      inten *= smoothstep(-0.05, 0.12, p.y);
      inten *= 1.0 - smoothstep(0.9, 1.3, p.y);   // the tip flickers out well below the tube top — no severed wisps
      inten = pow(inten, 1.75);
      /* blackbody ramp: deep red → orange → near-white core */
      vec3 c = mix(vec3(0.0), vec3(0.9, 0.12, 0.01), smoothstep(0.0, 0.35, inten));
      c = mix(c, vec3(1.15, 0.55, 0.06), smoothstep(0.3, 0.72, inten));
      c = mix(c, vec3(1.35, 1.05, 0.55), smoothstep(0.72, 0.98, inten));
      return c;
    }
    void main() {
      float tt = uTime;
      vec3 fire = vec3(0.0);
      if (uFlame > 0.001) {
        fire = fireBody(vUv, tt, 0.72, 3.7) * 0.35          // back flame: smaller, dimmer — interior depth
             + fireBody(vUv, tt, 1.0, 0.0);
        float bed = exp(-pow((vUv.y - 0.125) * 22.0, 2.0)) * (0.4 + 0.6 * noise(vec2(vUv.x * 40.0, tt * 1.7)));
        bed *= smoothstep(0.30, 0.10, abs(vUv.x - 0.5));    // narrow coal line under the flame only
        fire += vec3(1.0, 0.32, 0.06) * bed * 0.5;
      }
      vec3 col = fire * uFlame;                              // true black base — any tint mismatches the canvas black and prints shapes
      /* r140+WebGL2 already hardware-decodes the sRGB canvas texture to linear on
         sample — a pow(2.2) here double-decodes and turns the fire dark red */
      vec4 tex = texture2D(map, vUv);
      col = mix(col, tex.rgb, tex.a);                        // premultiplied: fire over nothing
      col *= 1.0 - uA * (0.5 + 0.5 * sin(vUv.y * uF + uTime * 4.0));
      /* the fire is a transparent standing flat inside the cabinet: rgb blends ONE /
         ONE_MINUS_SRC_ALPHA over the lit wood, and alpha CARVES the render-target mask
         toward 0 (blendDstAlpha ONE_MINUS_SRC_ALPHA) so fire pixels skip the dither */
      gl_FragColor = vec4(col, tex.a);
    }`;
  function screenPlane(g, screen, sw, sh, x, y, z, pairs, fire) {
    /* scanlines are computed per-fragment in the material — canvas-baked stripes
       moiré into garbage under perspective + persistence */
    const m = new THREE.Mesh(
      new THREE.PlaneGeometry(sw, sh),
      new THREE.ShaderMaterial({
        uniforms: {
          map: { value: screen.tex }, uTime: { value: 0 },
          /* the master's fire screen gets NO scanline/rolling-band treatment — it must
             read exactly like the reference tile; the small channel screens keep theirs */
          uF: { value: (pairs || 90) * 6.283 }, uA: { value: fire ? 0.0 : (pairs || 90) > 120 ? 0.07 : 0.11 },
          uFlame: { value: 0 },
        },
        vertexShader: SCREEN_VERT,
        fragmentShader: fire ? FIRE_FRAG : PLAIN_FRAG,
        ...(fire ? {                                         // transparent diorama flat, carving the dither mask
          transparent: true, depthWrite: false,
          blending: THREE.CustomBlending,
          blendSrc: THREE.OneFactor, blendDst: THREE.OneMinusSrcAlphaFactor,
          blendSrcAlpha: THREE.ZeroFactor, blendDstAlpha: THREE.OneMinusSrcAlphaFactor,
        } : {}),
      })
    );
    m.position.set(x, y, z + 0.04);
    g.add(m);
    return m;
  }
  function legs(g, w, d, h, y0) {
    const lm = new THREE.MeshStandardMaterial({ color: 0x6d6f75, roughness: 0.28, metalness: 0.85, envMapIntensity: 1.2 });   // steel legs
    [[-1, -1], [1, -1], [-1, 1], [1, 1]].forEach(([sx, sz]) => {
      const leg = new THREE.Mesh(new THREE.CylinderGeometry(0.035, 0.05, h, 10), lm);
      leg.position.set(sx * w * 0.4, y0 - h / 2, sz * d * 0.36);
      leg.rotation.z = -sx * 0.16; leg.rotation.x = sz * 0.14;
      g.add(leg);
    });
  }

  const devices = [];   // {group, screen, screenMesh, light, home:{pos,rot}, from:{pos,rot}, chan, draw}
  function addDevice(o) { o.group.userData.dev = o; devices.push(o); console3d.add(o.group); }

  /* master console — wood cabinet on splayed legs, the stage for everything.
     The tube is RECESSED inside the cabinet (Candle TV): an open frame, interior
     walls that catch the fire's warm light, the fire burning at the back of the box. */
  const master = (() => {
    const g = new THREE.Group();
    const screen = makeScreen(512, 384, { seed: 3 });
    const REC = 0.8;                                         // recess depth — shallow reads as a border, not a box
    /* hollow front: the body stops where the recess begins, and four solid wood
       rims frame the opening — a solid box would wall off the recessed tube */
    const body = new THREE.Mesh(new THREE.BoxGeometry(3.0, 2.5, 1.9 - REC), matWood);
    body.position.z = -REC / 2;
    g.add(body);
    const oT = 0.03 + 0.8625 + 0.08, oB = 0.03 - 0.8625 - 0.08;
    [[0, (oT + 1.25) / 2, 3.0, 1.25 - oT], [0, (oB - 1.25) / 2, 3.0, oB + 1.25],
     [-(1.23 + 1.5) / 2, (oT + oB) / 2, 1.5 - 1.23, oT - oB],
     [(1.23 + 1.5) / 2, (oT + oB) / 2, 1.5 - 1.23, oT - oB]].forEach(([bx, by, bw, bh]) => {
      const rim = new THREE.Mesh(new THREE.BoxGeometry(bw, bh, REC), matWood);
      rim.position.set(bx, by, 0.95 - REC / 2);
      g.add(rim);
    });
    /* solid lit back wall, then the fire as a transparent flat STANDING mid-box —
       its bottom edge on the recess floor, wood visible behind and beneath it */
    const backWall = new THREE.Mesh(new THREE.PlaneGeometry(2.3, 1.725), matWoodDark);   // dark, so the embers stay the brightest thing
    backWall.position.set(0, 0.03, 0.95 - REC);
    g.add(backWall);
    const screenMesh = screenPlane(g, screen, 2.3, 1.725, 0, 0.03, 0.95 - REC + 0.3, 150, true);
    /* face frame — dark-veneer strips over the rim fronts */
    [[0, (oT + 1.175) / 2, 2.82, 1.175 - oT], [0, (oB - 1.175) / 2, 2.82, oB + 1.175],
     [-1.32, 0.03, 0.18, oT - oB], [1.32, 0.03, 0.18, oT - oB]].forEach(([bx, by, bw, bh]) => {
      const strip = new THREE.Mesh(new THREE.BoxGeometry(bw, bh, 0.05), matWoodDark);
      strip.position.set(bx, by, 0.961); g.add(strip);
    });
    /* interior walls of the recess — LIGHT wood (the reference's lit interior);
       dark veneer here swallows the ember light and the box reads as a void */
    const mkWall = (pw, ph, rx, ry, wx, wy) => {
      const wall = new THREE.Mesh(new THREE.PlaneGeometry(pw, ph), matWood);
      wall.rotation.x = rx; wall.rotation.y = ry;
      wall.position.set(wx, wy, 0.95 - REC / 2);
      g.add(wall);
    };
    mkWall(2.3, REC, Math.PI / 2, 0, 0, 0.03 + 0.8625);      // ceiling, faces down
    mkWall(2.3, REC, -Math.PI / 2, 0, 0, 0.03 - 0.8625);     // floor, faces up
    mkWall(REC, 1.725, 0, Math.PI / 2, -1.15, 0.03);         // left, faces in
    mkWall(REC, 1.725, 0, -Math.PI / 2, 1.15, 0.03);         // right, faces in
    /* inset bezel — sits proud of the frame, outlining the opening */
    const ft = 0.08;
    [[0, 0.03 + 0.8625 + ft / 2, 2.3 + ft * 2, ft], [0, 0.03 - 0.8625 - ft / 2, 2.3 + ft * 2, ft],
     [-1.15 - ft / 2, 0.03, ft, 1.725], [1.15 + ft / 2, 0.03, ft, 1.725]].forEach(([bx, by, bw, bh]) => {
      const strip = new THREE.Mesh(new THREE.BoxGeometry(bw, bh, 0.06), matBezel);
      strip.position.set(bx, by, 0.975);
      g.add(strip);
    });
    /* controls on the bottom rail: dark bakelite bodies, bright chrome rims that
       catch light at every angle, ticks set at deliberate angles */
    const matBakelite = markClean(new THREE.MeshBasicMaterial({ color: 0x0e0f11 }));   // unlit flat face
    knob(g, 1.0, -1.065, 1.0, 0.065, { mat: matBakelite, flat: true, rot: 0.7 });    // proud of the strip face (0.986) — coplanar decals z-fight
    knob(g, 1.3, -1.065, 1.0, 0.065, { mat: matBakelite, flat: true, rot: -0.5 });
    legs(g, 3.0, 1.9, 0.78, -1.25);
    const light = new THREE.PointLight(0x37ff8b, 0, 5, 2);
    light.position.set(0, 0.1, 2.4); g.add(light);   // pushed off the plate so it doesn't bleach the veneer
    /* warm ember light at the FLAT's base — intensity follows the fire (masterFk);
       it pools on the floor around the fire's ground line and grades up the walls */
    const fireLight = new THREE.PointLight(0xff8c3c, 0, 3.2, 2);
    fireLight.position.set(0, -0.62, 0.95 - REC + 0.36); g.add(fireLight);
    const o = { group: g, screen, screenMesh, light, fireLight, backWall, chan: null,
      home: { pos: [0, 2.03, 0], rot: 0 }, from: { pos: [0, 2.03, 0], rot: 0 } };
    g.position.set(...o.home.pos);
    addDevice(o);
    return o;
  })();

  /* the five instruments — each channel on its native display hardware */
  function instrument(chanIdx, build, home, from) {
    const chan = CHAN[chanIdx];
    const g = new THREE.Group();
    const screen = makeScreen(build.round ? 300 : 440, build.round ? 300 : 330, { seed: chan.ch * 13 });
    const { screenMesh } = build.make(g, screen);
    const [r, gg, b] = TINT3[chan.ch];
    const light = new THREE.PointLight((r << 16) | (gg << 8) | b, 0, 2.6, 2);
    light.position.set(0, 0, build.depth / 2 + 0.7); g.add(light);
    const o = { group: g, screen, screenMesh, light, chan, draw: (specFor(chan.key) || {}).draw,
      round: !!build.round, graticule: !!build.graticule, mass: build.mass || 1, home, from };
    g.position.set(...home.pos); g.rotation.y = home.rot;
    addDevice(o);
  }

  /* Perceived cabinet weight follows frontal area first, with depth adding
     enough load that the suitcase monitor reads heavier than the thin panel. */
  const cabinetMass = (w, h, d) => w * h * (0.65 + d * 0.35);
  const mkBoxDevice = (w, h, d, sw, sh, mat) => ({
    depth: d, mass: cabinetMass(w, h, d),
    make(g, screen) {
      cabinet(g, w, h, d, mat || matDark);
      return { screenMesh: screenPlane(g, screen, sw, sh, 0, 0, d / 2) };
    },
  });
  const mkRoundDevice = (w, h, d, sr, mat) => ({
    depth: d, round: true, mass: cabinetMass(w, h, d),
    make(g, screen) {
      cabinet(g, w, h, d, mat || matDark);
      return { screenMesh: screenPlane(g, screen, sr * 2, sr * 2, 0, 0, d / 2) };
    },
  });

  /* CH1 oscilloscope — seated on top of the master, left */
  instrument(0, (() => {
    const b = Object.assign(mkBoxDevice(1.2, 0.85, 1.25, 0.92, 0.62, matBody("#1d2126", 11)), { graticule: true });
    const inner = b.make;
    b.make = (g, screen) => { const r = inner(g, screen); knob(g, 0.51, 0.1, 0.661, 0.045); knob(g, 0.51, -0.14, 0.661, 0.045); return r; };
    return b;
  })(), { pos: [-0.78, 3.71, 0.05], rot: 0.14 }, { pos: [-7.5, 6.8, -3.5], rot: 1.4 });
  /* CH3 vectorscope — round tube, on top right */
  instrument(2, (() => {
    const b = mkRoundDevice(1.0, 1.0, 1.15, 0.36, matBody("#22201c", 13));
    const inner = b.make;
    b.make = (g, screen) => { const r = inner(g, screen); knob(g, -0.2, -0.43, 0.611, 0.035); knob(g, 0, -0.43, 0.611, 0.035); knob(g, 0.2, -0.43, 0.611, 0.035); return r; };
    return b;
  })(), { pos: [0.72, 3.79, -0.02], rot: -0.2 }, { pos: [6.8, 7.4, -2.5], rot: -1.6 });
  /* CH5 radar CRT — floor right, base of the right tower */
  instrument(4, mkRoundDevice(1.25, 1.05, 1.45, 0.4, matBody("#15181a", 17)),
    { pos: [2.55, 0.53, 0.35], rot: -0.3 }, { pos: [7.5, 0.5, 2.5], rot: 1.1 });
  /* CH2 field monitor — lands on the radar, handle clear on top */
  instrument(1, (() => {
    const b = mkBoxDevice(1.5, 1.15, 1.3, 1.06, 0.8, matBody("#2a1e26", 19));
    const inner = b.make;
    b.make = (g, screen) => {
      const r = inner(g, screen);
      /* luggage-style grip seated on the top face — posts plus a bar, not a floating ring */
      [-0.2, 0.2].forEach(px => {
        const post = new THREE.Mesh(new THREE.CylinderGeometry(0.035, 0.048, 0.1, 10), matDark);
        post.position.set(px, 0.625, 0.14); g.add(post);   // forward of centre so it reads on the top face
      });
      const bar = new THREE.Mesh(new THREE.CylinderGeometry(0.042, 0.042, 0.52, 12), matDark);
      bar.rotation.z = Math.PI / 2; bar.position.set(0, 0.687, 0.14); g.add(bar);
      return r;
    };
    return b;
  })(), { pos: [2.62, 1.64, 0.42], rot: -0.36 }, { pos: [8.5, 6.8, 3.0], rot: -1.2 });
  /* CH4 dot-matrix panel — standing tall on the left */
  instrument(3, mkBoxDevice(1.25, 1.65, 0.4, 1.05, 1.42, matBody("#101820", 23)),
    { pos: [-2.1, 0.85, 0.4], rot: 0.34 }, { pos: [-8.5, 1.0, 2.8], rot: 1.3 });

  /* ================= responsive stack — wide bench vs portrait totem ================= */
  const DEV_NAME = { 1: "osc", 2: "field", 3: "vect", 4: "panel", 5: "radar" };
  const LAYOUTS = {
    wide: {
      osc: [-0.78, 3.71, 0.05, 0.14], vect: [0.76, 3.79, -0.02, -0.16],
      radar: [2.55, 0.53, 0.35, -0.3], field: [2.62, 1.64, 0.42, -0.36],
      panel: [-2.1, 0.85, 0.4, 0.34], camZ: 1, camY: 0,
    },
    tall: {                                                   // portrait: staggered column, small units on the floor in front
      osc: [-0.66, 3.71, 0.05, 0.10], vect: [0.66, 3.79, -0.05, -0.12],   // corners clear even rotated
      field: [0.62, 4.87, -0.05, -0.15],                      // seated square on the vectorscope, no bridging gap
      radar: [0.95, 0.53, 1.55, -0.35],
      panel: [-1.1, 0.83, 1.55, 0.5],                         // fully in front of the master at this rotation
      camZ: "auto", camY: 0.6,
    },
  };
  let layoutZ = 1, layoutY = 0;
  function applyLayout() {
    const L = innerWidth / innerHeight < 0.8 ? LAYOUTS.tall : LAYOUTS.wide;
    devices.forEach(d => {
      if (!d.chan) return;
      const h = L[DEV_NAME[d.chan.ch]];
      d.home.pos = [h[0], h[1], h[2]]; d.home.rot = h[3];
    });
    layoutZ = L.camZ === "auto"
      ? Math.min(2.0, Math.max(1.3, 0.62 / (innerWidth / innerHeight)))   // narrower screen → camera further back
      : L.camZ;
    layoutY = L.camY;
  }
  applyLayout();

  /* ================= fireflies — every fly gets a personality ================= */
  const N = innerWidth < 700 ? 340 : 620;

      if (f.y < 0.35) f.vy += (0.35 - f.y) * 4 * dt;

      /* ---- the cursor is a lantern: a force, so the lag is physical ---- */
      if (cAct > 0) {
        const dx = cursorS.x - f.x, dy = cursorS.y - f.y, dz = cursorS.z - f.z;
        const fall = Math.exp(-(dx * dx + dy * dy + dz * dz) / 2.4) * cAct;
        if (fall > 0.01) {
          f.vx += (dx * 1.6 - dy * 1.1 * f.swirl) * fall * dt;   // curl in, don't beeline
          f.vy += (dy * 1.6 + dx * 1.1 * f.swirl) * fall * dt;
          f.vz += dz * 1.2 * fall * dt;
          f.phase += fall * 0.5 * dt;                            // excitement speeds the flash clock
        }
        f.ex = fall;
      } else f.ex = 0;

      /* ---- integrate, clamped to each fly's cruising speed ---- */
      const sp = Math.hypot(f.vx, f.vy, f.vz), cap = f.cruise * (1 + f.ex);
      if (sp > cap) { const k2 = cap / sp; f.vx *= k2; f.vy *= k2; f.vz *= k2; }
      f.x += f.vx * dt; f.y += f.vy * dt; f.z += f.vz * dt;

      /* ---- pulse-coupled flashing (Mirollo–Strogatz): each fly runs its own clock and
             bumps forward when it sees a neighbour flash, so synchrony EMERGES locally ---- */
      f.fire = false;
      f.phase += dt / f.per;
      if (litNear > 0) f.phase += coupling * Math.min(3, litNear) * (f.stray ? 0.35 : 1);
      if (f.phase >= 1) { f.phase -= 1; f.fire = true; f.flash = 1; }
      const decay = f.style === 1 ? 7.5 : f.style === 0 ? 3.2 : 5.0;
      f.flash *= Math.exp(-decay * dt);
      if (f.style === 2 && f.flash < 0.42 && f.flash > 0.4) f.flash = 0.8;   // double pulse

      /* ---- scripted convergence into the tube still overrides position ---- */
      let px = f.x, py = f.y, pz = f.z;
      if (!f.stray && conv > 0) {
        /* the swarm pours into the FLAME's shape on the screen — the same three tongues
           the tube then keeps burning, so the ignition is continuous */
        const fv = (t * f.rise + f.u * 7) % 1;
        const fh = f.tongue === 0 ? 1.35 : f.tongue === 1 ? 0.70 : 0.63;   // matches the taller tube flame
        const fx0 = f.tongue === 0 ? 0 : (f.tongue === 1 ? -1 : 1) * 0.34;
        const fw2 = f.tongue === 0 ? 0.25 : 0.115;
        const fenv = Math.pow(1 - fv, 0.8) * Math.sqrt(fv + 0.06) * 2.1;
        const lx = fx0 + f.lat * fw2 * fenv + Math.sin(fv * 9 + t * 3 + f.wob) * 0.03 * (1 - fv);
        const ly = -0.62 + fv * fh;                          // screen-local: -0.86 is the tube floor
        _v.set(lx, ly, 0.06).applyMatrix4(m);
        const swirlAmt = Math.sin(conv * Math.PI) * 1.6;
        const ang = t * 1.2 * f.swirl + f.u * 6.28;
        px = lerp(f.x, _v.x + Math.cos(ang) * swirlAmt * (1 - condense), conv);
        py = lerp(f.y, _v.y + Math.sin(ang * 0.9) * swirlAmt * 0.5 * (1 - condense), conv);
        pz = lerp(f.z, _v.z + Math.sin(ang) * swirlAmt * 0.4 * (1 - condense), conv);
      }
      flyPos[i * 3] = px; flyPos[i * 3 + 1] = py; flyPos[i * 3 + 2] = pz;

      /* dim between flashes but never invisible — pure specks read as stars, not fireflies */
      let k = Math.pow(f.flash, 1.25) * 1.7 + 0.09;
      k *= f.stray ? lerp(1, 0.4, absorbed) : (1 - absorbed);
      if (f.band === 1) k *= 1 - banded * 0.45;              // background layer dims into the dark
      if (f.band === 2) k *= 1 - banded * 0.15;
      const toGreen = Math.max(sync * 0.55, conv);
      flyCol[i * 3] = lerp(f.r0, 0.28, toGreen) * k;
      flyCol[i * 3 + 1] = lerp(f.g0, 1.0, toGreen) * k;
      flyCol[i * 3 + 2] = lerp(f.b0, 0.55, toGreen) * k;
      flySize[i] = f.size * (0.68 + 0.9 * f.flash);          // lanterns swell as they light, stay visible between
    }
    flyGeo.attributes.position.needsUpdate = true;
    flyGeo.attributes.aColor.needsUpdate = true;
    flyGeo.attributes.aSize.needsUpdate = true;
  }

  function masterScreenDraw(t, p) {
    const s = master.screen, x = s.ctx, W = s.cv.width, H = s.cv.height;
    const pOn = sm(0.42, 0.455, p);
    s.uFlame = 0;                                             // only the idle state lights the shader fire
    if (pOn <= 0) { mflyCyc0 = -1; masterFk = 0; drawGlassOff(s); return; }

    const now = t;
    if (masterFx.state === "collapse") {
      const u = Math.min(1, (now - masterFx.t0) / 0.22);
      x.setTransform(1, 0, 0, 1, 0, 0);
      x.fillStyle = "#010302"; x.fillRect(0, 0, W, H);
      x.fillStyle = "rgba(235,255,245,0.95)";
      const hh = Math.max(2, (1 - u) * H * 0.5);
      x.fillRect(0, H / 2 - hh / 2, W, hh);
      if (u >= 1) { masterFx.state = "static"; masterFx.t0 = now; }
      return;
    }
    if (masterFx.state === "static") {
      drawStatic(s);
      if (now - masterFx.t0 > 0.3) { masterFx.state = masterFx.pending ? "chan" : "idle"; masterFx.t0 = now; }
      return;
    }
    if (masterFx.state === "chan") {
      const c = CHAN[masterFx.pending - 1], spec = specFor(c.key);
      const source = channelDevice(c.ch);
      const signalT = source ? signalAt(source.screen, now) : SIDE_STILL_T;
      masterFk = 0.15;                                        // embers bank down while a channel is tuned
      if (spec) {
        if (masterFx.renderCh !== c.ch) {
          masterFx.renderCh = c.ch;
          s.st = {};
          /* Stateful signals get a short history ending at the shared channel
             playhead, so the main tube opens on the side TV's current frame. */
          if (c.ch === 2) {
            for (let k = 84; k > 0; k--) spec.draw(x, W, H, signalT - k / 15, mkRnd(c.ch * 7), s.st);
          }
        }
        spec.draw(x, W, H, signalT, mkRnd(c.ch * 7), s.st);
      }
      overlayCRT(s, TINT[c.ch], `CH 0${c.ch} · ${c.name}`, 1, "top");
      return;
    }
    if (mflyCyc0 < 0) mflyCyc0 = t;                           // reveal epoch: open on the burning phase
    masterIdleDraw(x, W, H, t);
    const flash = Math.max(0, 1 - Math.abs(p - 0.452) * 55);
    if (flash > 0 || pOn < 1) {
      x.fillStyle = `rgba(240,255,246,${Math.max(flash * 0.85, (1 - pOn) * 0.5)})`;
      x.fillRect(0, 0, W, H);
    }
    /* no ON AIR bug — the fire IS the broadcast; a floating label breaks the diorama */
  }

  function deviceInertia(d) {
    const distance = Math.hypot(
      d.from.pos[0] - d.home.pos[0],
      d.from.pos[1] - d.home.pos[1],
      d.from.pos[2] - d.home.pos[2]
    );
    const weightLoad = sm(1.02, 1.94, d.mass);
    const distanceLoad = sm(5.2, 8.4, distance);
    return Math.min(1, weightLoad * 0.72 + distanceLoad * 0.28);
  }

  /* Same applied force, different inertia: heavy cabinets accelerate later
     and carry their movement longer. This critically damped response reaches
     the authored home pose without a decorative bounce or neighbour overlap. */
  function physicalArrival(u, inertia) {
    u = Math.min(1, Math.max(0, u));
    const rate = lerp(7.8, 4.2, inertia);
    const response = 1 - (1 + rate * u) * Math.exp(-rate * u);
    const settled = 1 - (1 + rate) * Math.exp(-rate);
    return response / settled;
  }

  /* The master is the stage: it resolves first, then each secondary cabinet
     enters in order across the back half of the five-second assembly. */
  const MASTER_ARRIVAL_P = 0.385;
  const SIDE_ARRIVAL_P = 0.50;
  const SIDE_STAGGER_P = 0.082;

  function deviceScreens(t, p) {
    devices.forEach((d, di) => {
      if (!d.chan) return;
      const i = [1, 3, 5, 4, 2].indexOf(d.chan.ch);          // fly-in order: osc, vect, radar, panel, then field lands on the radar
      const inertia = deviceInertia(d);
      const a0 = SIDE_ARRIVAL_P + i * SIDE_STAGGER_P;
      const travel = lerp(0.11, 0.17, inertia);
      const fi = Math.min(1, Math.max(0, (p - a0) / travel));
      d.group.visible = fi > 0.002;                          // parked off-stage until its fly-in starts
      if (!d.group.visible) { d.light.intensity = 0; return; }
      const e = physicalArrival(fi, inertia);
      const er = physicalArrival(fi, Math.min(1, inertia + 0.12));
      d.group.position.set(
        lerp(d.from.pos[0], d.home.pos[0], e),
        lerp(d.from.pos[1], d.home.pos[1], e),
        lerp(d.from.pos[2], d.home.pos[2], e)
      );
      d.group.rotation.y = lerp(d.from.rot, d.home.rot, er);
      d.group.rotation.z = (1 - er) * lerp(0.34, 0.18, inertia) * (di % 2 ? 1 : -1);

      const s = d.screen, x = s.ctx, W = s.cv.width, H = s.cv.height;
      /* A secondary tube comes alive while its cabinet is travelling in. Once
         it has landed, leave the final painted canvas untouched: this is the
         "broadcast bench" behaviour from the reference, rather than five
         permanently moving screens. */
      if (fi < 0.035) {
        if (s.phase !== "off") {
          drawGlassOff(s);
          s.phase = "off"; s.frameReady = false; s.bootAt = -1;
          s.signalT = SIDE_STILL_T; s.liveAt = -1; s.liveFrom = SIDE_STILL_T;
        }
        d.light.intensity = 0; return;
      }
      const live = !reduced && (
        (mode === "orbit" && hoverDev === d) ||
        (mode !== "orbit" && currentCh === d.chan.ch)
      );
      const arriving = fi < 0.995;
      if (s.bootAt < 0) {
        s.bootAt = t;
        primeDeviceSignal(d);
      }
      if (arriving) {
        s.signalT = t;
        s.liveAt = -1; s.liveFrom = s.signalT;
        s.phase = "arrival";
        paintDeviceSignal(d, s.signalT);
      } else {
        if (s.phase === "arrival" && s.frameReady) {
          /* Landing is a freeze, not a repaint: the last moving frame becomes
             the still and seeds hover / zoom continuation without a jump. */
          s.liveAt = -1; s.liveFrom = s.signalT;
          s.phase = "still";
        } else if (s.phase === "off" || !s.frameReady) {
          /* Direct-entry and reduced-motion paths have no arrival frames. */
          s.signalT = SIDE_STILL_T;
          s.liveAt = -1; s.liveFrom = s.signalT;
          paintDeviceSignal(d, s.signalT);
          s.phase = "still";
        }
        if (live) {
          playChannel(d.chan.ch, t);
          s.signalT = signalAt(s, t);
          s.phase = "live";
          paintDeviceSignal(d, s.signalT);
        } else if (s.liveAt >= 0) {
          /* Pause on the frame that was actually visible. Re-entering hover
             resumes from this playhead instead of jumping back or forward. */
          pauseChannel(d.chan.ch, t);
        }
      }
      const [r, g, b] = TINT3[d.chan.ch];
      d.light.intensity = 0.38 * (live ? 1.8 : arriving ? 1.18 : 1);
      d.light.color.setRGB(r / 255, g / 255, b / 255);
    });
  }

  function primeDeviceSignal(d) {
    const s = d.screen, x = s.ctx, W = s.cv.width, H = s.cv.height;
    s.st = {};
    /* CH 02 needs a small pre-roll to arrive as a full raster rather than
       visibly drawing upward from an empty monitor. */
    if (d.chan.ch === 2 && d.draw) {
      for (let k = 0; k < 80; k++) d.draw(x, W, H, k / 30, mkRnd(d.chan.ch * 13), s.st);
    }
  }

  function paintDeviceSignal(d, t) {
    const s = d.screen, x = s.ctx, W = s.cv.width, H = s.cv.height;
    x.setTransform(1, 0, 0, 1, 0, 0);
    if (d.round) {
      x.fillStyle = "#0a0c0d"; x.fillRect(0, 0, W, H);
      x.save();
      x.beginPath(); x.arc(W / 2, H / 2, W * 0.46, 0, 7); x.clip();
      if (d.chan.ch === 5) {
        x.translate(W / 2, H / 2); x.scale(0.82, 0.82); x.translate(-W / 2, -H / 2);
        x.fillStyle = "#0a0c0d"; x.fillRect(-W, -H, W * 3, H * 3);
      }
      if (d.draw) d.draw(x, W, H, t, mkRnd(d.chan.ch * 13), s.st);
      if (d.chan.ch === 5) moonLimb(x, W, H);
      x.restore();
      if (d.chan.ch !== 5) {
        x.strokeStyle = "rgba(200,205,215,0.25)"; x.lineWidth = 5;
        x.beginPath(); x.arc(W / 2, H / 2, W * 0.46, 0, 7); x.stroke();
      }
    } else if (d.draw) {
      d.draw(x, W, H, t, mkRnd(d.chan.ch * 13), s.st);
    }
    if (d.graticule) drawGraticule(s);
    overlayCRT(s, TINT[d.chan.ch], `CH 0${d.chan.ch} · ${d.chan.name}`, 1, d.round ? "round" : undefined);
    s.frameReady = true;
  }

  const camLook = new THREE.Vector3(0, 2.3, 0);
  const flyFrom = new THREE.Vector3(), flyTo = new THREE.Vector3(), lookTo = new THREE.Vector3();
  const pageCorners = Array.from({ length: 4 }, () => new THREE.Vector3());

  function syncPageToMaster() {
    if (!page.classList.contains("show")) return;
    const { width, height } = master.screenMesh.geometry.parameters;
    const local = [
      [-width / 2, height / 2], [width / 2, height / 2],
      [width / 2, -height / 2], [-width / 2, -height / 2],
    ];
    master.screenMesh.updateWorldMatrix(true, false);
    cam.updateMatrixWorld(true);
    for (let i = 0; i < 4; i++) {
      pageCorners[i].set(local[i][0], local[i][1], 0);
      master.screenMesh.localToWorld(pageCorners[i]);
      pageCorners[i].project(cam);
      pageCorners[i].set(
        (pageCorners[i].x * 0.5 + 0.5) * innerWidth,
        (-pageCorners[i].y * 0.5 + 0.5) * innerHeight,
        pageCorners[i].z
      );
    }
    const xs = pageCorners.map(c => c.x), ys = pageCorners.map(c => c.y);
    const left = Math.max(0, Math.min(...xs)), top = Math.max(0, Math.min(...ys));
    const right = Math.min(innerWidth, Math.max(...xs)), bottom = Math.min(innerHeight, Math.max(...ys));
    const widthPx = Math.max(1, right - left), heightPx = Math.max(1, bottom - top);
    const polygon = pageCorners.map(c =>
      `${((c.x - left) / widthPx * 100).toFixed(2)}% ${((c.y - top) / heightPx * 100).toFixed(2)}%`
    ).join(",");
    page.style.setProperty("--screen-left", `${left.toFixed(2)}px`);
    page.style.setProperty("--screen-top", `${top.toFixed(2)}px`);
    page.style.setProperty("--screen-width", `${widthPx.toFixed(2)}px`);
    page.style.setProperty("--screen-height", `${heightPx.toFixed(2)}px`);
    page.style.setProperty("--screen-clip", `polygon(${polygon})`);
    page.style.setProperty("--page-presence", sm(0.54, 0.9, flyT).toFixed(3));

    /* Approximate the projected outer cabinet from the tube opening. Four
       feathered panes blur everything beyond it without softening the TV. */
    const focusWidth = widthPx * 1.52, focusHeight = heightPx * 1.32;
    const focusLeft = Math.max(0, (left + right - focusWidth) / 2);
    const focusRight = Math.min(innerWidth, (left + right + focusWidth) / 2);
    const focusTop = Math.max(0, (top + bottom - focusHeight) / 2);
    const focusBottom = Math.min(innerHeight, (top + bottom + focusHeight) / 2);
    page.style.setProperty("--focus-left", `${focusLeft.toFixed(2)}px`);
    page.style.setProperty("--focus-right", `${focusRight.toFixed(2)}px`);
    page.style.setProperty("--focus-top", `${focusTop.toFixed(2)}px`);
    page.style.setProperty("--focus-bottom", `${focusBottom.toFixed(2)}px`);
    page.style.setProperty("--focus-height", `${Math.max(1, focusBottom - focusTop).toFixed(2)}px`);
    page.style.setProperty("--focus-presence", sm(0.32, 0.82, flyT).toFixed(3));
  }

  function updateCamera(t, p) {
    /* snap when close: an asymptotic lerp never stops, and sub-pixel drift makes the
       screen-fixed dither crawl along every edge */
    pointer.sx = Math.abs(pointer.x - pointer.sx) < 0.002 ? pointer.x : lerp(pointer.sx, pointer.x, 0.05);
    pointer.sy = Math.abs(pointer.y - pointer.sy) < 0.002 ? pointer.y : lerp(pointer.sy, pointer.y, 0.05);

    /* console yaw: starts steep so the turn proves the 3D, settles at hero 3/4 */
    /* no autonomous drift: the dither grid is screen-fixed, so any idle motion makes the
       quantized cabinet faces crawl. The console only turns with the scroll. */
    console3d.rotation.y = lerp(-0.62, -0.20, sm(0.42, 0.92, p)) + dragYaw;

    /* The whole bench must remain composed after the automatic reveal; the
       previous close end-stop cropped the upper/right televisions. */
    const baseZ = lerp(10.6, 8.05, sm(0.06, 0.55, p)) * layoutZ;
    const baseY = lerp(2.75, 2.15, sm(0.28, 0.75, p)) + layoutY;
    flyFrom.set(pointer.sx * 0.45, baseY + pointer.sy * -0.2 + dragPitch, baseZ);
    lookTo.set(0, lerp(2.35, 1.95, sm(0.3, 0.8, p)) + layoutY, 0);

    if (flyT > 0) {
      master.screenMesh.updateWorldMatrix(true, false);
      master.screenMesh.getWorldPosition(flyTo);
      _v.set(0, 0, 1).applyQuaternion(master.screenMesh.getWorldQuaternion(new THREE.Quaternion()));
      /* Stop far enough from the tube to keep its cabinet and bezel in view: the
         destination is a television we approach, not a full-screen route change. */
      flyTo.addScaledVector(_v, 3.25);
      const u = flyT;
      cam.position.lerpVectors(flyFrom, flyTo, u);
      master.screenMesh.getWorldPosition(_v);
      camLook.lerpVectors(lookTo, _v, u);
    } else {
      cam.position.copy(flyFrom);
      camLook.copy(lookTo);
    }
    cam.lookAt(camLook);
  }

  function updateHud(p) {
    document.body.classList.toggle("docked", p > 0.2 || mode !== "orbit");
    if (mode === "orbit") {
      cue.textContent =
        p < 0.35 ? "SCROLL — THE SWARM BECOMES SIGNAL ▼" :
        p < 0.85 ? "KEEP SCROLLING — ASSEMBLING THE CONSOLE" :
        "SELECT A CHANNEL — CLICK A SCREEN OR PRESS 1–5";
    }
  }

  function frame() {
    requestAnimationFrame(frame);
    const t = performance.now() / 1000 - clockStart;
    readScroll();
    sprog += (prog - sprog) * chase;
    if (reduced) sprog = 1;
    if (lockP !== null) sprog = lockP;
    const p = sprog;

    const dt = Math.min(0.05, Math.max(0.001, t - lastFrameT));
    lastFrameT = t;
    dragYaw += (dragYawT - dragYaw) * 0.14;                  // the grab has weight — nothing snaps
    dragPitch += (dragPitchT - dragPitch) * 0.14;
    if (!dragOn) {                                           // released: ease back to the composed framing
      const k3 = Math.pow(0.5, dt / 1.1);
      dragYawT *= k3; dragPitchT *= k3;
    }
    updateFireflies(t, p, dt);

    /* master reveal: invisible until the swarm condenses — its first flash lights the cabinet */
    master.group.visible = p > MASTER_ARRIVAL_P;
    const pOn = sm(0.42, 0.455, p);
    const flash = Math.max(0, 1 - Math.abs(p - 0.452) * 40);
    key.intensity = pOn * 0.55 + flash * 0.9;
    amb.intensity = lerp(0.1, 0.62, pOn);                   // darkness until the screen's flash lights the room
    rim.intensity = lerp(0.03, 0.3, pOn);
    master.light.intensity = pOn * (0.9 + flash * 2.2);
    master.fireLight.intensity = pOn * (0.3 + masterFk * 1.4 + flash * 0.4);    // interior glow follows the fire
    jarShadow.material.opacity = 0.9 * sm(0.40, 0.50, p);   // the ground darkens only once there is a bench to root

    const doTex = t - lastTex >= 1 / 30;
    if (doTex) {
      lastTex = t;
      masterScreenDraw(t, p);
      master.screen.tex.needsUpdate = true;
    }
    deviceScreens(t, p);
    if (doTex) devices.forEach(d => { if (d.chan) d.screen.tex.needsUpdate = true; });
    const envDef = ENV_STYLES[envStyle];                    // live backdrops (datamosh) advance at ~9fps
    if (envDef.tick && t - lastEnvTick >= 0.11) { lastEnvTick = t; envDef.tick(); envDef.sky.needsUpdate = true; }

    devices.forEach(d => {
      d.screenMesh.material.uniforms.uTime.value = t;
      d.screenMesh.material.uniforms.uFlame.value = d.screen.uFlame || 0;
    });
    updateCamera(t, p);
    syncPageToMaster();
    updateHud(p);
    if (reduced) {
      renderer.render(scene, cam);
    } else {
      renderer.setRenderTarget(rt);
      renderer.render(scene, cam);
      renderer.setRenderTarget(null);
      wobbleV *= 0.94;
      postMat.uniforms.uTime.value = t;
      /* reality steadies as the console assembles — screens stay wobble-free */
      const wobbleScale = mode === "orbit" ? 1 - sm(0.45, 0.75, p) : 0;
      postMat.uniforms.uAmp.value = (0.0012 + wobbleV * 0.011) * wobbleScale;
      postMat.uniforms.uAspect.value = innerWidth / innerHeight;
      postMat.uniforms.uMouse.value.set(pointer.sx * 0.5 + 0.5, 0.5 - pointer.sy * 0.5);
      renderer.render(postScene, postCam);
    }
    if (dbg) dbg.textContent = `p=${p.toFixed(3)} mode=${mode} flyT=${flyT.toFixed(2)} cam=${cam.position.toArray().map(v => v.toFixed(1))} scrollY=${scrollY | 0}`;
  }

  function flyScale() { flies.material.uniforms.uScale.value = innerHeight * Math.min(devicePixelRatio, 2) * 0.42; }
  addEventListener("resize", () => {
    cam.aspect = innerWidth / innerHeight;
    cam.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
    renderer.getDrawingBufferSize(rtSize);
    rt.setSize(rtSize.x, rtSize.y);
    postMat.uniforms.uRes.value.set(rtSize.x, rtSize.y);
    flyScale();
    applyLayout();
  });
  flyScale();

  /* boot */
  const startsAtOpening = lockP === null && !hashCh && !new URLSearchParams(location.search).has("ch");
  if (startsAtOpening) {
    if ("scrollRestoration" in history) history.scrollRestoration = "manual";
    scrollTo(0, 0);
    addEventListener("pageshow", () => scrollTo(0, 0), { once: true });
  }
  drawGlassOff(master.screen);
  devices.forEach(d => d.chan && drawGlassOff(d.screen));
  frame();
  scheduleAutoAdvance();
  /* ?ch=3 — instant entry, no cinematics (deep links, QA) */
  const jumpCh = parseInt(new URLSearchParams(location.search).get("ch"), 10);
  if (jumpCh >= 1 && jumpCh <= 5) {
    if (lockP === null) { lockP = 1; lockFromJump = true; }   // no scrolling — page mode doesn't need the document offset
    prog = 1; sprog = 1;
    flyT = 1; currentCh = jumpCh;
    masterFx.state = "chan"; masterFx.pending = jumpCh;
    enterPage(jumpCh);
  } else if (hashCh) {
    if (reduced) { scrollTo(0, maxScroll()); sprog = 1; enterPage(+hashCh); flyT = 1; currentCh = +hashCh; masterFx.state = "chan"; masterFx.pending = +hashCh; mode = "paged"; }
    else setTimeout(() => tuneTo(+hashCh), 600);
  } else if (reduced) {
    scrollTo(0, 0);
  }
})();
</script>
